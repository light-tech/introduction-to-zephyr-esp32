# General troubleshooting
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
#CONFIG_DEBUG_THREAD_INFO=y
#CONFIG_THREAD_ANALYZER=y
#CONFIG_THREAD_ANALYZER_USE_LOG=y
#CONFIG_SHELL=y
#CONFIG_DEBUG_OPTIMIZATIONS=y
#CONFIG_NO_OPTIMIZATIONS=y
#CONFIG_KERNEL_LOG_LEVEL_DBG=y

# Needed for display and LVGL (prevent stack overflow and crash)
CONFIG_MAIN_STACK_SIZE=8192

# Enable display driver (ST7735R)
CONFIG_DISPLAY=y
#CONFIG_DISPLAY_LOG_LEVEL_DBG=y

# Configure LVGL
CONFIG_LVGL=y
#CONFIG_LV_USE_LOG=y
#CONFIG_LV_LOG_LEVEL_TRACE=y
#CONFIG_LV_Z_SHELL=y
CONFIG_LV_Z_AUTO_INIT=n
CONFIG_LV_Z_MEM_POOL_SIZE=8192

# Enable LVGL widgets
CONFIG_LV_CONF_MINIMAL=y
#CONFIG_LV_USE_LABEL=y
#CONFIG_LV_LABEL_TEXT_SELECTION=y
#CONFIG_LV_LABEL_LONG_TXT_HINT=y
CONFIG_LV_USE_LINE=y
CONFIG_LV_USE_THEME_DEFAULT=y